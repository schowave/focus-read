name: focus_read
description: Reading aid for children — photograph book pages and read word by word.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  google_mlkit_text_recognition: ^0.15.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.5.3
  flutter_tts: ^4.2.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  mockito: ^5.4.4
  build_verify: ^3.1.0

flutter:
  generate: true
  uses-material-design: true
