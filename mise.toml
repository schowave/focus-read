# Tools and tasks: `mise run setup` once after cloning, `mise run check` before every push (CI runs the same)
[tools]
python = "3.15.2"  # README: 3.11–3.14; some doctr dependencies have no 3.15 wheels yet
uv = "0.13.10"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Prepare a fresh clone for `mise run check`: install runtime and dev dependencies into .venv"
run = "uv pip install -r backend/requirements.txt -r backend/requirements-dev.txt"

[tasks.lint]
description = "Lint the backend (ruff)"
run = "ruff check backend/"

[tasks.test]
description = "Smoke tests: OCR on the example image, FastAPI serves the frontend"
run = "python backend/smoke_test.py"

[tasks.check]
description = "Everything that must be green before a push (same as CI): lint and smoke tests"
depends = ["lint", "test"]

[tasks.dev]
description = "Start the server on http://localhost:8000"
run = "python backend/main.py"
