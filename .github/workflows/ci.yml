name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up tools (mise)
        uses: jdx/mise-action@v5

      - name: Setup
        run: mise run setup

      - name: Check (ruff lint, OCR smoke test, FastAPI serves frontend)
        run: mise run check
